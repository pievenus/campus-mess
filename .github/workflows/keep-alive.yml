name: Keep Supabase awake
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY" || { echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY variables not set"; exit 1; }
          curl -fsS --retry 3 --retry-delay 5 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
